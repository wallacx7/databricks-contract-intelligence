resources:
  jobs:
    contrato_vivo_diario:
      name: contrato-vivo-diario
      description: >-
        Traz as decisões dos revisores, reenvia leituras que falharam e processa os documentos novos
        (leitura, extração, confiança, fila de revisão e campos finais) e reconcilia os contratos com o billing.
      tasks:
        - task_key: sincronizar_revisoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/sincronizar_revisoes.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver.name}
              catalogo_revisao: ${resources.database_catalogs.catalogo_revisao.name}

        - task_key: reprocessar_falhas
          environment_key: default
          python_wheel_task:
            package_name: contrato_vivo
            entry_point: contrato-vivo-reprocessar
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --contratos
              - /Volumes/${var.catalog}/${resources.schemas.raw.name}/${resources.volumes.contratos.name}

        - task_key: leitura
          depends_on:
            - task_key: reprocessar_falhas
            - task_key: sincronizar_revisoes
          pipeline_task:
            pipeline_id: ${resources.pipelines.contrato_vivo_leitura.id}
        - task_key: reconciliacao
          depends_on:
            - task_key: leitura
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${resources.schemas.gold.name}
            commands:
              - dbt build --vars '${var.dbt_vars}'

        - task_key: atualizar_trechos
          depends_on:
            - task_key: leitura
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/atualizar_trechos.sql
            parameters:
              catalog: ${var.catalog}
              silver_schema: ${resources.schemas.silver.name}
              gold_schema: ${resources.schemas.gold.name}

        - task_key: indice_de_busca
          depends_on:
            - task_key: atualizar_trechos
          environment_key: default
          python_wheel_task:
            package_name: contrato_vivo
            entry_point: contrato-vivo-indice
            parameters:
              - --tabela
              - ${var.catalog}.${resources.schemas.gold.name}.trechos_indice
              - --endpoint
              - ${var.vector_search_endpoint}

      environments:
        - environment_key: dbt
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.9,<2.0
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
