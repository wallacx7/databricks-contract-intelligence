resources:
  jobs:
    contrato_vivo_gerador:
      name: contrato-vivo-gerador
      description: >-
        Gera os contratos e aditivos em PDF dos clientes Mid-Market e Enterprise a partir do billing do Ledger,
        com vazamentos plantados e gabarito. Apaga a geração anterior.
      parameters:
        - name: limite
          default: ""
      tasks:
        - task_key: gerar_contratos
          environment_key: default
          python_wheel_task:
            package_name: contrato_vivo
            entry_point: contrato-vivo-gerar
            parameters:
              - --ledger-catalog
              - ${var.catalog}
              - --ledger-schema
              - ${var.ledger_silver_schema}
              - --saida
              - /Volumes/${var.catalog}/${resources.schemas.raw.name}/${resources.volumes.contratos.name}
              - --gabarito
              - /Volumes/${var.catalog}/${resources.schemas.raw.name}/${resources.volumes.gabarito.name}
              - --limite
              - "{{job.parameters.limite}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
